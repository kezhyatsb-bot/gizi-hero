<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gizi Hero: Tangkap Piring Sehat!</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2A44;--sky1:#BDE7F5;--sky2:#FFF3C4;--card:#fff;--red:#E8503A;--green:#2F9E5B;--sun:#FFC93C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F3F6FF;--sky1:#1B2A4A;--sky2:#2B2F55;--card:#26305a}}
*{box-sizing:border-box;touch-action:manipulation}
html,body{height:100%;margin:0;background:#12182B;font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);overflow:hidden}
#area{position:relative;margin:0 auto;height:100%;max-width:480px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));user-select:none;-webkit-user-select:none;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:800;font-size:20px;z-index:5}
#hud button{border:0;background:var(--card);color:var(--ink);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
#plate{position:absolute;bottom:56px;font-size:58px;line-height:1;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.it{position:absolute;top:0;left:0;font-size:40px;line-height:1;will-change:transform}
#fact{position:absolute;left:12px;right:12px;top:54px;padding:8px 12px;border-radius:14px;background:var(--card);color:var(--ink);font-weight:700;font-size:15px;line-height:1.25;opacity:0;transition:opacity .2s;z-index:5;border-left:6px solid var(--green)}
#fact.bad{border-left-color:var(--red)}
#fact.on{opacity:1}
#cats{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}
.cat{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;width:58px;padding:3px 0;border-radius:12px;background:var(--card);opacity:.45;transition:.25s}
.cat b{font-size:22px;font-weight:400}
.cat.on{opacity:1;background:var(--sun);color:#1F2A44;transform:translateY(-6px)}
.ov{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:color-mix(in srgb,var(--sky1) 92%,transparent)}
.ov.hide{display:none}
h1{font-size:40px;line-height:1;margin:0 0 6px;font-weight:800}
h1 span{color:var(--red)}
.ov p{margin:6px 0;max-width:340px;font-size:17px;line-height:1.3}
.rules{background:var(--card);border-radius:18px;padding:10px 16px;margin:12px 0;text-align:left;font-size:16px;line-height:1.35}
.btn{border:0;background:var(--red);color:#fff;font:800 22px "Baloo 2",system-ui,sans-serif;padding:10px 36px;border-radius:999px;cursor:pointer;box-shadow:0 5px 0 #A8321F}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #A8321F}
.btn:focus-visible,#hud button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
small{opacity:.75;margin-top:12px;font-size:14px}
.pop{position:absolute;font-weight:800;font-size:22px;z-index:4;pointer-events:none;animation:up .8s forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}}
</style>
</head>
<body>
<div id="area">
  <div id="hud"><span id="sc">⭐ 0</span><span id="lv">❤️❤️❤️</span><button id="mute" aria-label="Suara">🔊</button></div>
  <div id="fact"></div>
  <div id="plate">🍽️</div>
  <div id="cats"></div>

  <div class="ov" id="start">
    <h1>Gizi <span>Hero</span></h1>
    <p>Jadilah pahlawan piring sehat!</p>
    <div class="rules">
      🥦🍎🥚 Tangkap makanan sehat<br>
      🍟🍩🥤 Hindari jajanan berlebihan<br>
      🌈 Kumpulkan 5 jenis gizi untuk bonus <b>Piring Seimbang</b>
    </div>
    <button class="btn" id="go">Mulai main</button>
    <small>Geser jari, mouse, atau tombol ← → untuk menggerakkan piring.<br>Kelompok 3: Alzena, Cheryl, Nabila, Kezhya, Rakha, Tamam</small>
  </div>

  <div class="ov hide" id="end">
    <h1 id="rank">Hero!</h1>
    <p id="final"></p>
    <div class="rules" id="tip"></div>
    <button class="btn" id="again">Main lagi</button>
  </div>
</div>

<script>
(function(){
var area=document.getElementById('area'),plate=document.getElementById('plate'),fact=document.getElementById('fact');
var CATS=[
 {k:'karbo',n:'Karbo',e:'🍚'},{k:'protein',n:'Protein',e:'🥚'},{k:'sayur',n:'Sayur',e:'🥦'},{k:'buah',n:'Buah',e:'🍎'},{k:'air',n:'Air',e:'💧'}];
var GOOD=[
 ['🍚','karbo','Nasi dan umbi memberi tenaga untuk belajar dan bermain.'],
 ['🍠','karbo','Ubi kaya serat, bikin kenyang lebih lama.'],
 ['🍞','karbo','Pilih roti gandum agar seratnya lebih banyak.'],
 ['🥚','protein','Telur punya protein untuk membangun otot dan otak.'],
 ['🐟','protein','Ikan kaya omega-3 yang baik untuk otak.'],
 ['🍗','protein','Protein membantu tubuh tumbuh dan memperbaiki sel.'],
 ['🥦','sayur','Brokoli penuh vitamin dan serat. Hijau itu keren!'],
 ['🥕','sayur','Wortel mengandung vitamin A untuk kesehatan mata.'],
 ['🥬','sayur','Sayuran hijau bantu pencernaan lancar.'],
 ['🍎','buah','Apel kaya serat dan vitamin. Makan dengan kulitnya!'],
 ['🍌','buah','Pisang memberi energi cepat sebelum olahraga.'],
 ['🍊','buah','Jeruk mengandung vitamin C untuk daya tahan tubuh.'],
 ['💧','air','Air putih 8 gelas sehari menjaga fokus dan tubuh segar.'],
 ['🥛','air','Susu mengandung kalsium untuk tulang yang kuat.']];
var BAD=[
 ['🍟','Gorengan dan kentang goreng berlebihan banyak lemak jenuh.'],
 ['🍩','Donat manis bikin gula darah naik lalu cepat lemas.'],
 ['🥤','Satu botol minuman manis bisa mengandung banyak sendok gula!'],
 ['🍭','Permen terlalu sering bisa merusak gigi.'],
 ['🍔','Fast food terlalu sering kurang serat dan tinggi garam.'],
 ['🍕','Makanan olahan sering tinggi garam dan lemak.']];

var W,H,x,tx,items,score,lives,level,got,combo,run,last,spawnT,raf,musicOn=true,ac,fTimer,eaten;
function $(id){return document.getElementById(id)}

/* ---------- Suara ---------- */
function ctx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,d,type,v,t0){var a=ctx();if(!a||!musicOn)return;var o=a.createOscillator(),g=a.createGain();t0=t0||a.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d)}
function sGood(){tone(660,.12,'triangle',.2);tone(880,.18,'triangle',.2,(ac?ac.currentTime:0)+.08)}
function sBad(){tone(180,.3,'sawtooth',.18);tone(120,.35,'sawtooth',.18,(ac?ac.currentTime:0)+.12)}
function sWin(){[523,659,784,1047].forEach(function(f,i){tone(f,.25,'square',.12,(ac?ac.currentTime:0)+i*.1)})}
function sOver(){[392,330,262,196].forEach(function(f,i){tone(f,.3,'triangle',.18,(ac?ac.currentTime:0)+i*.18)})}
var mel=[523,587,659,784,659,587,523,392,440,523,587,659,587,523,440,392],mi=0,mTimer;
function music(on){clearInterval(mTimer);if(!on)return;mTimer=setInterval(function(){if(!run)return;tone(mel[mi%mel.length]/2,.18,'sine',.05);if(mi%2===0)tone(mel[mi%mel.length],.12,'triangle',.035);mi++},Math.max(150,260-level*12))}

/* ---------- Tampilan ---------- */
function buildCats(){$('cats').innerHTML=CATS.map(function(c){return '<div class="cat" id="c-'+c.k+'"><b>'+c.e+'</b>'+c.n+'</div>'}).join('')}
function hud(){$('sc').textContent='⭐ '+score;$('lv').textContent=new Array(Math.max(lives,0)+1).join('❤️')||'💔'}
function showFact(t,bad){fact.textContent=t;fact.className='on'+(bad?' bad':'');fact.classList.toggle('bad',!!bad);clearTimeout(fTimer);fTimer=setTimeout(function(){fact.classList.remove('on')},2600)}
function pop(t,px,color){var p=document.createElement('div');p.className='pop';p.textContent=t;p.style.left=(px-16)+'px';p.style.top=(H-130)+'px';p.style.color=color;area.appendChild(p);setTimeout(function(){p.remove()},850)}
function size(){W=area.clientWidth;H=area.clientHeight}

/* ---------- Game ---------- */
function reset(){
  size();items&&items.forEach(function(i){i.el.remove()});items=[];score=0;lives=3;level=1;got={};combo=0;eaten=0;spawnT=0;x=tx=W/2;
  buildCats();hud();fact.className='';
}
function spawn(){
  var bad=Math.random()<Math.min(.28+level*.03,.45),d,el=document.createElement('div');
  d=bad?BAD[Math.floor(Math.random()*BAD.length)]:GOOD[Math.floor(Math.random()*GOOD.length)];
  el.className='it';el.textContent=d[0];area.appendChild(el);
  items.push({el:el,x:30+Math.random()*(W-60),y:-50,v:120+level*28+Math.random()*50,bad:bad,d:d,r:Math.random()*40-20});
}
function catchItem(it){
  if(it.bad){
    lives--;combo=0;sBad();pop('Aduh!',it.x,'#E8503A');showFact('🚫 '+it.d[1],true);
    area.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:200});
  }else{
    var cat=it.d[1];eaten++;combo++;var pts=10+Math.min(combo,10);score+=pts;sGood();pop('+'+pts,it.x,'#2F9E5B');showFact('✅ '+it.d[2]);
    got[cat]=1;var c=$('c-'+cat);c&&c.classList.add('on');
    if(Object.keys(got).length===5){score+=50;sWin();pop('Piring Seimbang! +50',Math.max(W/2,90),'#FF8A00');showFact('🌈 Piring Seimbang! Karbo, protein, sayur, buah, dan air lengkap.');got={};setTimeout(function(){CATS.forEach(function(c){var e=$('c-'+c.k);e&&e.classList.remove('on')})},700)}
    var nl=1+Math.floor(eaten/10);if(nl>level){level=nl;music(true)}
  }
  hud();if(lives<=0)over();
}
function loop(t){
  if(!run)return;var dt=Math.min((t-last)/1000,.05);last=t;
  x+=(tx-x)*Math.min(1,dt*14);plate.style.left=x+'px';
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.45,1.1-level*.07)}
  for(var i=items.length-1;i>=0;i--){
    var it=items[i];it.y+=it.v*dt;
    it.el.style.transform='translate('+(it.x-20)+'px,'+it.y+'px) rotate('+(it.y/6+it.r)+'deg)';
    if(it.y>H-120&&it.y<H-70&&Math.abs(it.x-x)<46){catchItem(it);it.el.remove();items.splice(i,1);if(!run)return}
    else if(it.y>H){it.el.remove();items.splice(i,1)}
  }
  raf=requestAnimationFrame(loop);
}
function start(){ctx();$('start').classList.add('hide');$('end').classList.add('hide');reset();run=true;last=performance.now();music(true);raf=requestAnimationFrame(loop)}
function over(){
  run=false;cancelAnimationFrame(raf);music(false);sOver();
  var r=score>=400?'🏆 Gizi Master!':score>=200?'🥇 Gizi Hero!':score>=80?'🥈 Pejuang Sehat!':'🌱 Pemula Sehat';
  $('rank').textContent=r;$('final').textContent='Skor kamu '+score+'. Kamu menangkap '+eaten+' makanan sehat.';
  var tips=['Isi piringku: separuh sayur dan buah, separuh lagi karbo dan protein.','Kurangi minuman manis, ganti dengan air putih.','Jangan lewatkan sarapan agar fokus belajar.','Cuci tangan sebelum makan, ya!'];
  $('tip').innerHTML='💡 '+tips[Math.floor(Math.random()*tips.length)];
  $('end').classList.remove('hide');
}

/* ---------- Kontrol ---------- */
function move(cx){var r=area.getBoundingClientRect();tx=Math.max(35,Math.min(W-35,cx-r.left))}
area.addEventListener('pointermove',function(e){move(e.clientX)});
area.addEventListener('pointerdown',function(e){move(e.clientX)});
window.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')tx=Math.max(35,tx-60);if(e.key==='ArrowRight')tx=Math.min(W-35,tx+60)});
window.addEventListener('resize',size);
$('go').onclick=start;$('again').onclick=start;
$('mute').onclick=function(){musicOn=!musicOn;this.textContent=musicOn?'🔊':'🔇'};
size();buildCats();
})();
</script>
</body>
</html>
